quarkus.application.name=chamados-backend
quarkus.http.port=${PORT:8080}

# ---------- Banco ----------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# ---------- Admin inicial (prod exige as variáveis; dev/test usam valores locais) ----------
admin.inicial.nome=${ADMIN_NOME:Administrador}
admin.inicial.email=${ADMIN_EMAIL}
admin.inicial.senha=${ADMIN_SENHA}
%dev,test.admin.inicial.email=${ADMIN_EMAIL:admin@joveretec.local}
%dev,test.admin.inicial.senha=${ADMIN_SENHA:admin12345}

# ---------- CORS ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Location

# ---------- Logs ----------
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
