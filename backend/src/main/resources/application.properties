quarkus.application.name=chamados-backend
quarkus.http.port=${PORT:8080}

# ---------- Banco ----------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=10
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# ---------- JWT (em dev/test o Quarkus gera um par de chaves temporário) ----------
mp.jwt.verify.issuer=${JWT_ISSUER:https://chamados.joveretec.com.br}
jwt.duracao-minutos=${JWT_DURACAO_MINUTOS:480}
%prod.mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
# Autenticação sob demanda: erros de token passam pelos ExceptionMappers (corpo padronizado)
quarkus.http.auth.proactive=false

# ---------- Admin inicial (prod exige as variáveis; dev/test usam valores locais) ----------
admin.inicial.nome=${ADMIN_NOME:Administrador}
admin.inicial.email=${ADMIN_EMAIL}
admin.inicial.senha=${ADMIN_SENHA}
%dev,test.admin.inicial.email=${ADMIN_EMAIL:admin@joveretec.local}
%dev,test.admin.inicial.senha=${ADMIN_SENHA:admin12345}

# ---------- Armazenamento de anexos ----------
# local: disco do servidor (dev/test, sem Supabase) | supabase: Supabase Storage (produção)
armazenamento.tipo=${ARMAZENAMENTO_TIPO:local}
%prod.armazenamento.tipo=${ARMAZENAMENTO_TIPO:supabase}
armazenamento.bucket=${STORAGE_BUCKET:chamados-anexos}
armazenamento.validade-download=PT5M
armazenamento.pendentes.expiram-apos=PT24H
armazenamento.limpeza.intervalo=1h
armazenamento.local.diretorio=${ARMAZENAMENTO_LOCAL_DIRETORIO:${java.io.tmpdir}/chamados-anexos}
# Supabase (obrigatórios só com armazenamento.tipo=supabase). A service role key fica APENAS no backend.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
# Chave pública (anon/publishable): enviada ao navegador para o upload TUS assinado.
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.storage.tus-path=/storage/v1/upload/resumable/sign
# O envio local passa pelo backend (só dev/test); em produção o arquivo vai direto ao Supabase.
%dev,test.quarkus.http.limits.max-body-size=2G
# Testes chamam a limpeza diretamente.
%test.quarkus.scheduler.enabled=false

# ---------- CORS ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Location,Content-Disposition

# ---------- Health (/q/health; readiness inclui o datasource) ----------
quarkus.datasource.health.enabled=true

# ---------- Logs ----------
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
