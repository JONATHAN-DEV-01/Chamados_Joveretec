<section class="cartao filtros" aria-label="Filtros">
  <div class="linha" [class.sem-projeto]="!mostrarProjeto()">
    <div class="campo busca">
      <label for="busca">Buscar</label>
      <input id="busca" type="search" placeholder="Título ou descrição" [formControl]="campoBusca" />
    </div>

    @if (mostrarProjeto()) {
      <div class="campo">
        <label for="filtro-projeto">Projeto</label>
        <select id="filtro-projeto" (change)="filtrar.emit({ projetoId: valorSelect($event) })">
          <option value="">Todos</option>
          @for (projeto of projetos(); track projeto.id) {
            <option [value]="projeto.id" [selected]="String(projeto.id) === parametros().projetoId">{{ projeto.nome }}{{ projeto.arquivado ? ' (arquivado)' : '' }}</option>
          }
        </select>
      </div>
    }

    <div class="campo">
      <label for="filtro-responsavel">Responsável</label>
      <select id="filtro-responsavel" (change)="filtrar.emit({ responsavel: valorSelect($event) })">
        <option value="">Todos</option>
        @if (usuarioLogado(); as eu) {
          <option [value]="eu.id" [selected]="String(eu.id) === parametros().responsavel">Eu ({{ eu.nome }})</option>
        }
        <option [value]="SEM_RESPONSAVEL" [selected]="parametros().responsavel === SEM_RESPONSAVEL">Sem responsável</option>
        @for (usuario of usuarios(); track usuario.id) {
          @if (usuario.id !== usuarioLogado()?.id) {
            <option [value]="usuario.id" [selected]="String(usuario.id) === parametros().responsavel">{{ usuario.nome }}</option>
          }
        }
      </select>
    </div>
  </div>

  <div class="linha-chips">
    <div class="grupo" role="group" aria-labelledby="rotulo-urgencia">
      <span id="rotulo-urgencia" class="rotulo">Urgência</span>
      @for (urgencia of URGENCIAS; track urgencia) {
        <button
          type="button"
          class="chip"
          [attr.aria-pressed]="urgenciasSelecionadas().includes(urgencia)"
          (click)="alternarUrgencia(urgencia)"
        >
          {{ urgencia | rotuloUrgencia }}
        </button>
      }
    </div>

    <div class="grupo" role="group" aria-labelledby="rotulo-status">
      <span id="rotulo-status" class="rotulo">Status</span>
      @for (status of statusDisponiveis(); track status) {
        <button
          type="button"
          class="chip"
          [attr.aria-pressed]="statusSelecionados().includes(status)"
          (click)="alternarStatus(status)"
        >
          {{ status | rotuloStatus }}
        </button>
      }
    </div>

    @if (temFiltros()) {
      <button type="button" class="btn btn-fantasma btn-pequeno limpar" (click)="limparTudo()">Limpar filtros</button>
    }
  </div>
</section>
